[project]
name = "okala"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "opmermaid", email = "ali@cartesianlabs.io" }
]
requires-python = ">=3.13"
dependencies = [
    "catboost>=1.2.8,<2",
    "jdatetime>=6.1.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "seaborn>=0.13.2",
    "scipy>=1.15,<2",
    "tqdm>=4.67,<5",
    "xgboost-cpu>=3.2,<4",
]

[project.scripts]
okala = "okala:main"
okala-features = "okala.features:main"
okala-modeling = "okala.modeling:main"
okala-refine = "okala.refinement:main"
okala-analyze = "okala.diagnostics:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1,<9",
]
